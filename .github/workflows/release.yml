name: release

# On a version tag this builds the package once, publishes it to PyPI via
# trusted publishing (no API token stored in the repo), and attaches the built
# wheel and sdist to a GitHub Release for the tag. The PyPI project must list
# this repo and workflow as a trusted publisher first.

on:
  push:
    # PyGAD tags releases as the bare version number, e.g. 3.6.0 (no "v").
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import runpy
          version = runpy.run_path("pygad/_version.py")["__version__"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != version:
              raise SystemExit(f"Release tag {tag} does not match package version {version}")
          PY
      - name: Build distributions
        run: |
          pip install build . pytest responses 'vilvik>=0.5.3'
          python -m pytest tests/test_push_to_vilvik.py tests/test_vilvik_compatibility.py -q
          python -m build
      - name: Check distributions
        run: |
          pip install twine
          python -m twine check dist/*
      - name: Check documentation
        run: |
          pip install -r docs/requirements.txt
          python docs/markdown_compatibility.py
          python -m sphinx -b html -W --keep-going docs/source docs/build/html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the built files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
